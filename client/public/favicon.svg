<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 115">
  <defs>
    <linearGradient id="rqStroke" x1="5" y1="4" x2="95" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="48%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="rqBg" x1="5" y1="4" x2="95" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A0B30"/>
      <stop offset="100%" stop-color="#0B1C38"/>
    </linearGradient>
    <linearGradient id="rqECG" x1="10" y1="90" x2="55" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <clipPath id="rqClip">
      <path d="M50,4 L93,18 L93,60 C90,79 73,94 50,109 C27,94 10,79 7,60 L7,18 Z"/>
    </clipPath>
  </defs>

  <!-- Shield fill -->
  <path d="M50,4 L93,18 L93,60 C90,79 73,94 50,109 C27,94 10,79 7,60 L7,18 Z" fill="url(#rqBg)"/>

  <g clip-path="url(#rqClip)">
    <!-- Stars -->
    <circle cx="64" cy="13" r="1.2" fill="white" opacity="0.6"/>
    <circle cx="54" cy="10" r="0.8" fill="white" opacity="0.45"/>
    <circle cx="71" cy="20" r="1"   fill="white" opacity="0.5"/>

    <!-- Mountains -->
    <path d="M24,66 L40,37 L56,66 Z" fill="#1C3557" opacity="0.45"/>
    <path d="M44,66 L61,29 L78,66 Z" fill="#172E4A" opacity="0.35"/>

    <!-- Dog (left) -->
    <ellipse cx="23" cy="69" rx="9" ry="9.5" fill="#6D28D9" opacity="0.92"/>
    <circle  cx="32" cy="59" r="7"            fill="#7C3AED" opacity="0.92"/>
    <path d="M25,56 C20,55 17,60 18,67" stroke="#5B21B6" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    <path d="M39,56 C44,55 46,60 45,67" stroke="#5B21B6" stroke-width="5.5" fill="none" stroke-linecap="round"/>

    <!-- Rabbit (center) -->
    <ellipse cx="47" cy="81" rx="8.5" ry="9.5" fill="#4C1D95" opacity="0.88"/>
    <circle  cx="51" cy="69" r="6.5"            fill="#5B21B6" opacity="0.88"/>
    <ellipse cx="47" cy="57" rx="2.8" ry="8"    fill="#6D28D9" opacity="0.88"/>
    <ellipse cx="55" cy="56" rx="2.8" ry="8"    fill="#6D28D9" opacity="0.88"/>

    <!-- Cat (right) -->
    <ellipse cx="73" cy="81" rx="8.5" ry="9.5" fill="#0E7490" opacity="0.92"/>
    <circle  cx="75" cy="67" r="7"              fill="#0891B2" opacity="0.92"/>
    <path d="M69,63 L65,52 L75,60 Z" fill="#0E7490"/>
    <path d="M81,63 L85,52 L75,60 Z" fill="#0E7490"/>

    <!-- Network dots -->
    <circle cx="40" cy="39" r="2.3" fill="#A855F7" opacity="0.75"/>
    <circle cx="50" cy="32" r="2.3" fill="#818CF8" opacity="0.75"/>
    <circle cx="60" cy="39" r="2.3" fill="#3B82F6" opacity="0.75"/>
    <circle cx="57" cy="50" r="2.3" fill="#0891B2" opacity="0.75"/>
    <circle cx="43" cy="50" r="2.3" fill="#06B6D4" opacity="0.75"/>
    <line x1="40" y1="39" x2="50" y2="32" stroke="#7C3AED" stroke-width="0.8" opacity="0.75"/>
    <line x1="50" y1="32" x2="60" y2="39" stroke="#3B82F6" stroke-width="0.8" opacity="0.75"/>
    <line x1="60" y1="39" x2="57" y2="50" stroke="#06B6D4" stroke-width="0.8" opacity="0.75"/>
    <line x1="57" y1="50" x2="43" y2="50" stroke="#06B6D4" stroke-width="0.8" opacity="0.75"/>
    <line x1="43" y1="50" x2="40" y2="39" stroke="#7C3AED" stroke-width="0.8" opacity="0.75"/>

    <!-- ECG line -->
    <path d="M10,91 L20,91 L22,82 L26,100 L30,89 L34,91 L52,91"
      stroke="url(#rqECG)" stroke-width="1.9" fill="none"
      stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="7"  cy="97" r="1.7" fill="#A855F7" opacity="0.8"/>
    <circle cx="10" cy="98" r="1.7" fill="#A855F7" opacity="0.8"/>
    <circle cx="55" cy="86" r="1.7" fill="#06B6D4" opacity="0.8"/>

    <!-- Medical cross -->
    <rect x="47"   y="101" width="5.5" height="13" rx="1.8" fill="#06B6D4"/>
    <rect x="43.5" y="104.5" width="12" height="5.5" rx="1.8" fill="#06B6D4"/>
  </g>

  <!-- Shield stroke -->
  <path d="M50,4 L93,18 L93,60 C90,79 73,94 50,109 C27,94 10,79 7,60 L7,18 Z"
    fill="none" stroke="url(#rqStroke)" stroke-width="2.3"/>
</svg>
