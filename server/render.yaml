version: "1"
services:
  - type: web
    name: resqnet-api
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # You need to provide these securely in the Render dashboard:
      # - MONGODB_URI
      # - JWT_SECRET
      # - CLOUDINARY_CLOUD_NAME
      # - CLOUDINARY_API_KEY
      # - CLOUDINARY_API_SECRET
      # - OPENAI_API_KEY
      # - RESEND_API_KEY
      # - CLIENT_URL
